<!DOCTYPE html>
<html lang="en">
<head>

  <h2>Our Products</h2>
  <div class="products">

    <div class="card"><h3>Product 2</h3><p>Stylish product</p><p>Price: $30</p></div>
    <div class="card"><h3>Product 3</h3><p>Popular product</p><p>Price: $25</p></div>
  </div>
  <p><a href="../../index.html">Back to Portfolio</a></p>

</html>
